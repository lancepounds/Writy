<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>
/* Lance.os supplies the outer window; standalone Writy has its own title bar. */
if (window.top !== window.self && new URLSearchParams(location.search).get('embed') === 'lanceos') {
  document.documentElement.classList.add('lanceos-embedded');
}
</script>
<meta name="description" content="Writy: a word prediction word processor. The words you are about to type, a tap away.">
<link rel="manifest" href="writy.webmanifest">
<meta name="theme-color" content="#0050EE">
<link rel="icon" type="image/png" sizes="32x32" href="writy-32.png">
<link rel="apple-touch-icon" href="writy-apple-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Writy">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Writy</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Lexend:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Layout: one Windows XP (Luna) window filling the screen above a taskbar. The suggestion bar is the biggest thing in it. */
:root{
  --gx:max(16px,env(safe-area-inset-left,0px));
  --gx2:max(16px,env(safe-area-inset-right,0px));
  --ink:#000000; --ink-soft:#444444; --face:#ECE9D8; --face-dk:#D6D2C2; --paper:#FFFFFF;
  --line:#7F9DB9; --edge:#003C74; --link:#215DC6; --hot:#F8B330; --hot-in:#FFE7A2;
  --signal:#316AC5; --ring:#98B8EA; --off:#ACA899; --off-bg:#F5F4EA; --off-edge:#C9C7BA;
  --btn:linear-gradient(180deg,#FFFFFF 0%,#F4F3EE 40%,#ECEBE6 85%,#D6D0C5 100%);
  --btnpress:linear-gradient(180deg,#CDCAC3 0%,#E3E3DB 20%,#E5E4DE 80%,#F2F2F1 100%);
  --nav1:#7BA2E7; --nav2:#6375D6; --navbody:#D6DFF7; --navhead-a:#FFFFFF; --navhead-b:#C6D3F7;
  --frame:#0831D9;
  --chk-spell:#C0301A; --chk-gram:#215DC6; --chk-ok:#2E7D32; --chk-ink:#FFFFFF;
  --dial-pick:#F8B330; --dial-grp:#FFE7A2; --lineh:rgba(255,206,72,.28);
  --pz-bg:#2350CC; --pz-edge:#F8B330; --pz-w1:linear-gradient(180deg,#FFFFFF 0%,#E9F0FF 100%); --pz-w1-ink:#0B1F55; --pz-w1-edge:#0E2A80;
  --pz-w2:#D3E2FF; --pz-w2-ink:#0B1F55; --pz-line:#DCE8FF; --pz-hi:#FFD24D; --pz-hi-ink:#0B1F55;
  --pz-head:linear-gradient(180deg,#FFE08A 0%,#F8B330 100%); --pz-head-ink:#2B1B00; --pz-num:#51608C; --pz-ring:#86A8EE; --pz-note:#E6EDFF; --mw-veil:rgba(255,255,255,.92); --rd-sent:rgba(74,127,216,.14); --rd-word:#FFD24D;
  --sky-a:#2B6CD8; --sky-b:#4C8FEA; --sky-c:#86B8F2; --sky-d:#BFD9F7;
  --hill-a:#3F9A1E; --hill-b:#4DA82A; --hill-c:#5BB935; --hill-d:#2F8317; --hill-e:#45A024;
  --cloud:rgba(255,255,255,.85);
  --font:Tahoma,"Atkinson Hyperlegible","Segoe UI",Verdana,ui-sans-serif,sans-serif;
  --titlefont:"Trebuchet MS",Tahoma,"Atkinson Hyperlegible",sans-serif;
  --edfont:"Atkinson Hyperlegible",Tahoma,Verdana,sans-serif;
  --edsize:30px; --edline:1.5; --sugsize:26px; --sugh:64px; --keyh:60px; --dwell:1.2s; --cols:5;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --ink:#F1F1EC; --ink-soft:#B9BBC4; --face:#2F323B; --face-dk:#23252C; --paper:#16181D;
  --line:#5C6B85; --edge:#8DB1EE; --link:#8FB4FF; --hot:#F8B330; --hot-in:#6B4E10;
  --signal:#4A7FD8; --ring:#5B84C9; --off:#6A6E7B; --off-bg:#262830; --off-edge:#3C3F49;
  --btn:linear-gradient(180deg,#4B505C 0%,#3D414C 45%,#343741 90%,#2A2C34 100%);
  --btnpress:linear-gradient(180deg,#25272E 0%,#30333B 30%,#30333B 80%,#3A3D47 100%);
  --nav1:#2E4378; --nav2:#232B52; --navbody:#2A3050; --navhead-a:#3A4A7C; --navhead-b:#2A3560;
  --sky-a:#070B24; --sky-b:#0F1B52; --sky-c:#233A78; --sky-d:#3A568F;
  --hill-a:#1F4A1A; --hill-b:#1A4016; --hill-c:#16360F; --hill-d:#173A14; --hill-e:#122F10;
  --cloud:rgba(255,255,255,.14);
  --chk-spell:#FF9A8A; --chk-gram:#8FB4FF; --chk-ok:#7FD48A; --chk-ink:#101218;
  --dial-pick:#9A6E12; --dial-grp:#4A3A12; --lineh:rgba(255,206,72,.10);
  --pz-bg:#13265F; --pz-edge:#E8A626; --pz-w1:linear-gradient(180deg,#456DDA 0%,#3359C4 100%); --pz-w1-ink:#FFFFFF; --pz-w1-edge:#07112F;
  --pz-w2:#2A468F; --pz-w2-ink:#F0F4FF; --pz-line:#9DBBFF; --pz-hi:#F8B330; --pz-hi-ink:#1A1200;
  --pz-head:linear-gradient(180deg,#FFD976 0%,#E8A626 100%); --pz-head-ink:#1E1400; --pz-num:#D4DEFF; --pz-ring:#A9C2FF; --pz-note:#E6EDFF; --mw-veil:rgba(22,24,29,.9); --rd-sent:rgba(143,180,255,.15); --rd-word:#8A5F12;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --ink:#F1F1EC; --ink-soft:#B9BBC4; --face:#2F323B; --face-dk:#23252C; --paper:#16181D;
  --line:#5C6B85; --edge:#8DB1EE; --link:#8FB4FF; --hot:#F8B330; --hot-in:#6B4E10;
  --signal:#4A7FD8; --ring:#5B84C9; --off:#6A6E7B; --off-bg:#262830; --off-edge:#3C3F49;
  --btn:linear-gradient(180deg,#4B505C 0%,#3D414C 45%,#343741 90%,#2A2C34 100%);
  --btnpress:linear-gradient(180deg,#25272E 0%,#30333B 30%,#30333B 80%,#3A3D47 100%);
  --nav1:#2E4378; --nav2:#232B52; --navbody:#2A3050; --navhead-a:#3A4A7C; --navhead-b:#2A3560;
  --sky-a:#070B24; --sky-b:#0F1B52; --sky-c:#233A78; --sky-d:#3A568F;
  --hill-a:#1F4A1A; --hill-b:#1A4016; --hill-c:#16360F; --hill-d:#173A14; --hill-e:#122F10;
  --cloud:rgba(255,255,255,.14);
  --chk-spell:#FF9A8A; --chk-gram:#8FB4FF; --chk-ok:#7FD48A; --chk-ink:#101218;
  --dial-pick:#9A6E12; --dial-grp:#4A3A12; --lineh:rgba(255,206,72,.10);
  --pz-bg:#13265F; --pz-edge:#E8A626; --pz-w1:linear-gradient(180deg,#456DDA 0%,#3359C4 100%); --pz-w1-ink:#FFFFFF; --pz-w1-edge:#07112F;
  --pz-w2:#2A468F; --pz-w2-ink:#F0F4FF; --pz-line:#9DBBFF; --pz-hi:#F8B330; --pz-hi-ink:#1A1200;
  --pz-head:linear-gradient(180deg,#FFD976 0%,#E8A626 100%); --pz-head-ink:#1E1400; --pz-num:#D4DEFF; --pz-ring:#A9C2FF; --pz-note:#E6EDFF; --mw-veil:rgba(22,24,29,.9); --rd-sent:rgba(143,180,255,.15); --rd-word:#8A5F12;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none !important}
html,body{height:100%}
body{
  margin:0;color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.35;overscroll-behavior:none;
  background-color:var(--sky-c);
  background-image:
    radial-gradient(140% 60% at 30% 108%,var(--hill-a) 0%,var(--hill-b) 38%,var(--hill-c) 52%,transparent 53%),
    radial-gradient(120% 55% at 90% 112%,var(--hill-d) 0%,var(--hill-e) 45%,transparent 46%),
    radial-gradient(140px 40px at 30% 24%,var(--cloud),transparent 70%),
    radial-gradient(200px 50px at 72% 16%,var(--cloud),transparent 70%),
    linear-gradient(180deg,var(--sky-a) 0%,var(--sky-b) 35%,var(--sky-c) 62%,var(--sky-d) 78%);
  background-attachment:fixed;
}
button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none;position:relative}
input,textarea{font-family:inherit;color:var(--ink)}
:focus-visible{outline:2px solid var(--signal);outline-offset:-3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.desk{height:100%;display:flex;flex-direction:column;min-height:0}
.window{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--face);overflow:hidden}
@media (min-width:900px){
  .desk{padding:16px var(--gx2) 0 var(--gx)}
  .window{width:100%;max-width:1240px;margin:0 auto;border:3px solid var(--frame);border-top:none;border-radius:8px 8px 0 0;box-shadow:2px 3px 14px rgba(0,0,0,.5)}
}
/* Maximized and fullscreen modes retain the XP chrome but use the entire viewport. */
.desk.maximized{padding:0}
.desk.maximized .window{width:100%;max-width:none;margin:0;border:0;border-radius:0;box-shadow:none}
.desk.maximized .titlebar{margin:0;padding-left:var(--gx);padding-right:var(--gx2);border-radius:0}

/* title bar */
.titlebar{display:flex;align-items:center;gap:8px;padding:5px var(--gx2) 5px var(--gx);flex:0 0 auto;
  background:linear-gradient(180deg,#0997FF 0%,#0053EE 8%,#0050EE 40%,#0066FF 88%,#0055E5 94%,#0036C4 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
@media (min-width:900px){.titlebar{margin:0 -3px;padding-left:calc(var(--gx) + 3px);padding-right:calc(var(--gx2) + 3px);border-radius:8px 8px 0 0}}
.ticon{width:18px;height:18px;flex:0 0 auto;filter:drop-shadow(1px 1px 0 rgba(0,0,0,.4))}
.caption{font:bold 15px/1.2 var(--titlefont);color:#fff;text-shadow:1px 1px 0 #0A1883;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.caps{margin-left:auto;display:flex;gap:2px;pointer-events:none}
.cap{width:23px;height:23px;border:1px solid #fff;border-radius:3px;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 90% 90%,#0054E9 0%,#2263D5 55%,#4480F2 80%,#78A4F6 100%);box-shadow:inset -1px -1px 1px rgba(0,0,0,.25)}
.cap i{display:block;background:#fff}
.cap.min i{width:8px;height:3px;margin-top:9px;margin-right:4px}
.cap.max i{width:11px;height:11px;background:none;border:1px solid #fff;border-top-width:3px}
.caps button.cap{padding:0;pointer-events:auto}
.cap.max[aria-pressed="true"] i{width:10px;height:9px;position:relative}
.cap.max[aria-pressed="true"] i::after{content:"";position:absolute;width:9px;height:8px;border:1px solid #fff;border-top-width:3px;left:-5px;top:2px;background:#2463D5}
.cap.close{background:radial-gradient(circle at 90% 90%,#CC4600 0%,#DC6527 55%,#E5936C 80%,#F1BDA5 100%)}
.cap.close i{width:12px;height:12px;background:none;position:relative}
.cap.close i::before,.cap.close i::after{content:"";position:absolute;left:-1px;top:5px;width:14px;height:2px;background:#fff}
.cap.close i::before{transform:rotate(45deg)}
.cap.close i::after{transform:rotate(-45deg)}
button.cap{pointer-events:auto}

/* address bar */
.navbar{display:flex;align-items:center;gap:6px;padding:4px var(--gx2) 4px var(--gx);flex:0 0 auto;background:var(--face);border-bottom:1px solid var(--paper);box-shadow:0 1px 0 var(--face-dk)}
.navbtn{width:32px;height:32px;border-radius:50%;flex:0 0 auto;font-size:12px;color:#fff;display:flex;align-items:center;justify-content:center;text-shadow:0 1px 1px rgba(0,0,0,.4);
  background:radial-gradient(circle at 40% 30%,#B8F3A6 0%,#4DC43A 40%,#1E8C12 100%);border:1px solid #1B6B11;box-shadow:inset 0 1px 1px rgba(255,255,255,.6),1px 1px 1px rgba(0,0,0,.2)}
.navbtn:hover{filter:brightness(1.12)}
.navbtn:disabled{filter:grayscale(1) brightness(1.2);opacity:.6;cursor:default}
.address{flex:1;min-width:0;display:flex;align-items:center;gap:6px;height:30px;padding:0 6px;background:var(--paper);border:1px solid var(--line);font-size:14px;white-space:nowrap;overflow:hidden}
.address::before{content:"Address";color:var(--ink-soft);padding-right:6px;margin-right:2px;border-right:1px solid var(--face-dk)}
.crumb{color:var(--ink)}
.sep{font-size:0}.sep::after{content:"\\";font-size:14px;color:var(--ink-soft)}
.address input{flex:1;min-width:0;border:none;background:transparent;font-size:14px;font-weight:bold;height:100%;padding:0;outline-offset:2px}
@media (max-width:560px){.address::before{display:none}.crumb,.sep{display:none}}

/* menu bar */
.toolbar{display:flex;flex-wrap:wrap;align-items:center;padding:2px var(--gx2) 2px calc(var(--gx) - 6px);flex:0 0 auto;background:var(--face);border-bottom:1px solid var(--face-dk)}
.tbtn{padding:8px 12px;min-height:40px;font-size:14px;color:var(--ink);border:1px solid transparent}
.tbtn:hover{background:var(--signal);color:#fff}
.tbtn[aria-pressed="true"]{background:var(--paper);border-color:var(--off) var(--paper) var(--paper) var(--off);font-weight:bold;color:var(--ink)}
.tsep{width:1px;height:20px;background:var(--face-dk);border-right:1px solid var(--paper);margin:0 4px}
@media (min-width:641px) and (max-width:1200px){.tbtn{padding:8px 9px}}
@media (max-width:640px){
  .toolbar{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));padding:2px var(--gx2) 2px var(--gx);gap:2px}
  .tbtn{padding:6px 2px;font-size:12.5px;min-height:38px;overflow:hidden;text-overflow:ellipsis}
  .opt,.tsep{display:none}
}


/* Compact formatting controls and a read-only formatted preview. */
.fmt-toggle{height:30px;padding:3px 10px;background:var(--btn);border:1px solid var(--edge);border-radius:3px;font-size:13px;color:var(--ink);white-space:nowrap}
.fmt-toggle:hover,.fmt-toggle[aria-expanded="true"]{background:var(--btnpress);border-color:var(--signal)}
.formatbar[hidden]{display:none!important}
.formatbar{display:flex;align-items:center;flex-wrap:wrap;gap:5px;padding:5px var(--gx2) 5px var(--gx);flex:0 0 auto;background:var(--face);border-bottom:1px solid var(--face-dk)}
.fmtlabel{font-weight:700;font-size:13px;color:var(--ink-soft);padding-right:5px}
.fmtbtn{min-width:40px;min-height:40px;padding:6px 10px;background:var(--btn);border:1px solid var(--edge);border-radius:3px;font-size:14px;color:var(--ink);box-shadow:inset -1px -1px 0 rgba(0,0,0,.08)}
.fmtbtn:hover,.fmtbtn:focus-visible{box-shadow:inset 0 0 0 2px var(--hot)}
.fmtbtn:active,.fmtbtn[aria-pressed="true"]{background:var(--btnpress);border-color:var(--signal)}
.fmtbtn.fmtbold{font-weight:800}.fmtbtn.fmtitalic{font-style:italic}.fmtbtn.fmtunderline{text-decoration:underline}
.fmthelp{font-size:12px;color:var(--ink-soft);margin-left:auto}
.fmtpreview{flex:1;min-width:0;overflow:auto;padding:20px 24px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font-family:var(--edfont);font-size:clamp(16px,var(--edsize),36px);line-height:var(--edline);overflow-wrap:anywhere}
.fmtpreview h1{font-size:1.55em;margin:.4em 0 .65em;line-height:1.2}
.fmtpreview h2{font-size:1.25em;margin:.5em 0 .65em;line-height:1.25}
.fmtpreview p{margin:0 0 .75em}.fmtpreview ul,.fmtpreview ol{padding-left:1.7em;margin:.3em 0 .8em}
.fmtpreview li{margin:.15em 0}
.fmtpreview blockquote{border-left:4px solid var(--signal);padding:.25em .8em;margin:.35em 0 .8em;color:var(--ink-soft)}
.fmtpreview .fmtempty{font-style:italic;color:var(--ink-soft)}
.editor.is-preview .edwrap{display:none}
.editor:not(.is-preview) .fmtpreview{display:none}
.editor.is-rich .edwrap,.editor.is-rich .fmtpreview{display:none}
.rich-editor[hidden]{display:none!important}
.rich-editor{flex:1;min-width:0;overflow:auto;padding:18px 20px;border:1px solid var(--line);
  background:var(--paper);color:var(--ink);font-family:var(--edfont);font-size:var(--edsize);
  line-height:var(--edline);outline:none;white-space:pre-wrap;overflow-wrap:anywhere;
  user-select:text;-webkit-user-select:text;caret-color:var(--signal)}
.rich-editor:focus{box-shadow:0 0 0 2px var(--signal)}
.rich-editor h1{font-size:1.5em;line-height:1.25;margin:.4em 0}
.rich-editor h2{font-size:1.25em;line-height:1.3;margin:.4em 0}
.rich-editor p{margin:.25em 0 .7em}
.rich-editor ul,.rich-editor ol{padding-left:1.6em}
.rich-editor blockquote{border-left:4px solid var(--signal);padding-left:.85em;margin:.5em 0;color:var(--ink)}
.fmtselect{min-height:40px;min-width:76px;padding:3px 6px;border:1px solid var(--edge);border-radius:3px;background:var(--paper);color:var(--ink);font:14px var(--font)}
.fmtselect:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
html.rich-active .checkbar{display:none!important}
html.rich-active .linehi{display:none!important}
html.rich-active .sugbar{display:block}
html.rich-active .fmthelp{display:none}

@media (max-width:640px){
  .formatbar{gap:4px;padding:5px var(--gx2) 5px var(--gx)}
  .fmtlabel,.fmthelp{display:none}
  .fmtbtn{flex:1 1 auto;min-width:40px;min-height:42px;padding:7px 5px}
}
html.gaze .fmtbtn,html.tablet .fmtbtn{min-height:52px;min-width:52px}

/* frame */
.frame{flex:1;min-height:0;display:flex;background:var(--paper);border-top:1px solid var(--off)}
.navpane{display:none}
@media (min-width:980px){
  .navpane{display:block;width:230px;flex:0 0 230px;overflow-y:auto;padding:12px;background:linear-gradient(180deg,var(--nav1) 0%,var(--nav2) 100%)}
  .nphead{font-size:12px;font-weight:bold;color:var(--link);padding:6px 12px;border-radius:5px 5px 0 0;background:linear-gradient(90deg,var(--navhead-a) 0%,var(--navhead-b) 100%)}
  .nphead + .nplist{border-top:none}
  .navpane .nplist{margin-bottom:12px}
}
.nplist{background:var(--navbody);padding:6px;border:1px solid var(--paper)}
.navpane.noside{display:none}
.npedit{display:block;width:100%;text-align:left;margin-top:4px;padding:8px 6px 4px;border-top:1px solid var(--line) !important;font-size:13px;font-weight:bold;color:var(--link)}
.li{display:flex;align-items:stretch;gap:2px}
.liopen{flex:1;min-width:0;text-align:left;padding:7px 6px;font-size:13px;color:var(--link);display:flex;flex-direction:column;gap:1px}
.liopen small{font-size:11px;color:var(--ink-soft)}
.liopen:hover{color:#428EFF;text-decoration:underline}
.liopen[aria-current="true"]{font-weight:bold;color:var(--ink)}
.lidel{flex:0 0 auto;min-width:34px;padding:0 8px;font-size:13px;color:var(--link)}
.lidel:hover{color:#CC4600;text-decoration:underline}
.lidel.armed{color:#fff;background:#CC4600;font-weight:bold}
.empty-note{padding:10px 6px;color:var(--ink-soft);font-size:13px}

.content{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--paper)}

/* suggestion bar */
.sugbar{order:0;flex:0 0 auto;padding:8px var(--gx2) 8px var(--gx);background:var(--face);border-bottom:1px solid var(--face-dk)}
.content.kb-on .sugbar{order:2;border-bottom:none;border-top:1px solid var(--face-dk)}
.sughead{display:flex;justify-content:space-between;gap:12px;font-size:12px;color:var(--ink-soft);margin-bottom:6px}
.sugrow{display:flex;flex-direction:column;gap:8px}
.sugline{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:8px;border-radius:3px}
.sug,.act,.key,.dlgbtn{background:var(--btn);border:1px solid var(--edge);border-radius:3px;color:var(--ink);box-shadow:inset -1px -1px 0 rgba(0,0,0,.08)}
.sug{min-height:var(--sugh);padding:8px 6px;display:flex;align-items:center;justify-content:center;text-align:center;
  font-family:var(--edfont);font-weight:700;font-size:var(--sugsize);line-height:1.1;overflow-wrap:anywhere}
.sug[data-arg="0"]{box-shadow:inset 0 0 0 2px var(--ring),inset -1px -1px 0 rgba(0,0,0,.08)}
.sug .num{position:absolute;top:3px;left:6px;font:11px var(--font);font-weight:normal;color:var(--ink-soft)}
.sug:hover,.act:hover,.key:hover,.dlgbtn:hover{box-shadow:inset 0 0 0 2px var(--hot),inset 0 0 0 3px var(--hot-in)}
.sug:active,.act:active,.key:active,.dlgbtn:active{background:var(--btnpress);box-shadow:none}
.sugnone{grid-column:1 / -1;padding:14px 6px;color:var(--ink-soft)}
.floatsug{position:fixed;z-index:30;left:0;top:0;padding:6px;background:var(--face);border:2px solid var(--frame);border-radius:6px;box-shadow:2px 3px 10px rgba(0,0,0,.45)}
.floatsug .sug{min-height:calc(var(--sugsize) * 1.7);padding:4px 6px;white-space:nowrap;overflow-wrap:normal;overflow:hidden}
.floatsug .sugrow,.floatsug .sugline{gap:6px}
.floatsug .sugnone{padding:6px 10px}

/* word tree: words branch out from the cursor; follow-up words hang under each branch */
.treebox{position:fixed;z-index:30;left:0;top:0;width:max-content;display:flex;flex-direction:column;padding:6px 10px 10px;background:var(--face);border:2px solid var(--frame);border-radius:6px;box-shadow:2px 3px 10px rgba(0,0,0,.45);--tscale:1}
.treebox.up{flex-direction:column-reverse;padding:10px 10px 6px}
.tarrow{position:absolute;top:-10px;left:20px;width:16px;height:16px;background:var(--face);border:2px solid var(--frame);border-right:none;border-bottom:none;transform:rotate(45deg);pointer-events:none}
.treebox.up .tarrow{top:auto;bottom:-10px;transform:rotate(225deg)}
.tlines{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.tlines path{fill:none;stroke:var(--signal);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.tlines path.k{stroke-width:2.5;opacity:.7}
.trootrow{position:relative;height:30px;flex:0 0 auto}
.troot{position:absolute;top:1px;left:0;max-width:240px;padding:3px 13px;border-radius:14px;background:var(--signal);color:#fff;font:bold 16px/22px var(--edfont);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 1px 2px rgba(0,0,0,.3)}
.tfan{height:38px;flex:0 0 auto}
.treebox.short .tfan{height:14px}
.treebox.flat .trootrow,.treebox.flat .tfan{display:none}
.tcols{display:flex;gap:12px;align-items:flex-start}
.treebox.up .tcols{align-items:flex-end}
.tcol{display:flex;flex-direction:column;align-items:flex-start;gap:6px;min-width:0;border-radius:4px}
.treebox.up .tcol{flex-direction:column-reverse}
.treebox .sug{z-index:1;white-space:nowrap;overflow-wrap:normal;overflow:hidden;max-width:100%}
.treebox .tw{min-width:0;overflow:hidden;text-overflow:ellipsis}
.treebox .t1{align-self:stretch;min-height:calc(var(--sugsize) * var(--tscale) * 1.7);font-size:calc(var(--sugsize) * var(--tscale));padding:4px 16px}
.treebox .t2{min-height:calc(var(--sugsize) * var(--tscale) * 1.36);font-size:calc(var(--sugsize) * var(--tscale) * .78);padding:2px 12px;margin-left:22px;background:var(--paper);border-color:var(--line);font-weight:600}
@media (pointer:fine){.treebox .t1{padding-left:22px}}

/* radial dial: pie slices around a hub; the whole slice is the target */
.dialbox{position:fixed;z-index:30;left:0;top:0;border-radius:50%;background:var(--face-dk);border:2px solid var(--frame);box-shadow:2px 3px 12px rgba(0,0,0,.45)}
.darrow{position:absolute;width:16px;height:16px;background:var(--face-dk);border:2px solid var(--frame);border-right:none;border-bottom:none;pointer-events:none}
.dring,.dlabels{position:absolute;inset:0;pointer-events:none}
.dialbox .dw{position:absolute;display:block;pointer-events:auto;min-height:0;padding:0;border:0;border-radius:0;box-shadow:none !important;background:var(--btn)}
.dialbox .dw.t2{background:var(--paper)}
.dialbox .dw:hover{background:var(--dial-grp)}
.dialbox .dw.picked,.dialbox .dw.scan-item{outline:none;background:var(--dial-pick) !important}
.dialbox .dw.scan-group{outline:none;background:var(--dial-grp)}
.dialbox .dwelling::after{display:none}
.dialbox .dw.dwelling{animation:dialdwell var(--dwell) linear forwards}
@keyframes dialdwell{from{background:var(--dial-grp)}to{background:var(--dial-pick)}}

/* drop-down menu: an XP menu under the text cursor; ▸ opens a submenu of follow-up words */
.ddmenu{position:fixed;z-index:30;left:0;top:0}
.ddmain,.ddsub{background:var(--paper);border:1px solid var(--off);box-shadow:2px 2px 5px rgba(0,0,0,.35);padding:2px;min-width:180px}
.ddsub{position:absolute;min-width:150px}
.ddhead{display:flex;align-items:center;gap:6px;padding:3px 10px 4px;margin:0 0 2px;background:linear-gradient(90deg,var(--signal) 0%,#5A8DE0 100%);color:#fff;font:bold 15px/20px var(--edfont);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:320px}
.ddhead::after{content:"";border:5px solid transparent;border-top:6px solid #fff;margin-top:5px;opacity:.85}
.ddmenu.up .ddhead::after{border-top-color:transparent;border-bottom:6px solid #fff;margin-top:-5px}
.ddmenu.nohead .ddhead{display:none}
.ddmenu.up .ddmain{display:flex;flex-direction:column-reverse}
.ddmenu.up .ddhead{margin:2px 0 0}
.dditem{display:flex;align-items:stretch;color:var(--ink);border-radius:0}
.dditem:hover,.dditem.on{background:var(--signal);color:#fff}
.dditem:has(.picked){background:var(--signal);color:#fff}
.ddmenu .ddw{flex:1 1 auto;display:flex;align-items:center;justify-content:flex-start;gap:4px;min-height:calc(var(--sugsize) * 1.55);padding:2px 12px 2px 8px;text-align:left;
  background:none;border:0;border-radius:0;box-shadow:none !important;color:inherit;white-space:nowrap;font-family:var(--edfont);font-weight:700;font-size:var(--sugsize);line-height:1.1}
.ddmenu .t2.ddw{font-size:calc(var(--sugsize) * .85);font-weight:600;min-height:calc(var(--sugsize) * 1.45);padding-left:12px}
.ddmenu .ddw:hover{box-shadow:none !important}
.ddmenu .ddw:active{background:rgba(0,0,0,.18)}
.ddmenu .ddw .num{position:static;display:inline-block;width:1.5em;flex:0 0 auto;font:12px var(--font);color:inherit;opacity:.65}
.ddmenu .ddw.picked,.ddmenu .ddw.scan-item{outline:4px solid var(--hot);outline-offset:-4px;background:transparent !important;color:#fff}
.ddmenu .dditem:has(.scan-item){background:var(--signal);color:#fff}
.ddarrow{flex:0 0 40px;display:flex;align-items:center;justify-content:center;color:inherit;border-left:1px solid transparent}
.ddarrow::after{content:"";border:6px solid transparent;border-left:7px solid currentColor;border-right:none;margin-left:4px}
.ddmenu.subleft .ddarrow{order:-1}
.ddmenu.subleft .ddarrow::after{border-left:none;border-right:7px solid currentColor;margin-left:0;margin-right:4px}
.dl{position:absolute;left:0;top:0;display:block;white-space:nowrap;line-height:1.15;font-family:var(--edfont);font-weight:700;color:var(--ink);pointer-events:none}
.dl.l2{font-weight:600}
.dnum{position:absolute;font:11px var(--font);color:var(--ink-soft);pointer-events:none}
.dhub{position:absolute;border-radius:50%;background:var(--signal);display:flex;align-items:center;justify-content:center;pointer-events:none;box-shadow:inset 0 2px 0 rgba(255,255,255,.3),0 1px 3px rgba(0,0,0,.35)}
.dhl{color:#fff;font:bold 16px/1.1 var(--edfont);white-space:nowrap}

/* editor */
.editor{order:1;flex:1;min-height:0;display:flex;padding:10px var(--gx2) 10px var(--gx);background:var(--paper)}
.editor textarea{flex:1;min-width:0;width:100%;resize:none;padding:14px 16px;border:1px solid var(--line);border-radius:0;background:transparent;position:relative;z-index:1;
  font-family:var(--edfont);font-size:var(--edsize);line-height:var(--edline);outline:none;caret-color:var(--signal)}
.edwrap{position:relative;flex:1;min-width:0;display:flex}
.backdrop{position:absolute;left:0;top:0;right:0;bottom:0;overflow:hidden;pointer-events:none;white-space:pre-wrap;overflow-wrap:break-word;word-wrap:break-word;color:transparent;border:1px solid transparent;padding:14px 16px;font-family:var(--edfont);font-size:var(--edsize);line-height:var(--edline)}
.linehi{position:absolute;left:1px;right:1px;top:0;height:40px;background:var(--lineh);pointer-events:none;border-radius:2px}
.backdrop u{text-decoration:underline wavy;text-decoration-thickness:2px;text-underline-offset:5px;text-decoration-color:var(--chk-gram);color:transparent}
.backdrop u.t-spelling{text-decoration-color:var(--chk-spell)}
.backdrop u.cur{background:var(--hot-in)}
/* reading back: the sentence and the word being read */
.backdrop .rds{background:var(--rd-sent);border-radius:3px}

.voicerow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;flex:1 1 300px;min-width:0}

.sug.picked{outline:5px solid var(--hot);outline-offset:-2px;background:var(--hot-in) !important;color:var(--ink)}
.editor textarea:focus{box-shadow:0 0 0 2px var(--signal)}
.editor textarea::selection{background:var(--signal);color:#fff}

/* on-screen keyboard */
.kb{order:3;flex:0 0 auto;padding:8px var(--gx2) 8px var(--gx);background:var(--face);border-top:1px solid var(--off)}

.key{flex:var(--w,1) 1 0;min-width:0;min-height:var(--keyh);font-size:calc(var(--keyh) * .4);font-weight:bold;padding:0}
.key[aria-pressed="true"]{background:var(--btnpress);box-shadow:inset 0 0 0 2px var(--signal)}

.ksrange::-webkit-slider-runnable-track{height:12px;border-radius:6px;background:var(--off-edge);border:1px solid var(--off)}
.ksrange::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:34px;height:34px;margin-top:-12px;border-radius:50%;background:var(--signal);border:3px solid var(--paper);box-shadow:0 1px 4px rgba(0,0,0,.45)}
.ksrange::-moz-range-track{height:12px;border-radius:6px;background:var(--off-edge);border:1px solid var(--off)}
.ksrange::-moz-range-thumb{width:28px;height:28px;border-radius:50%;background:var(--signal);border:3px solid var(--paper);box-shadow:0 1px 4px rgba(0,0,0,.45)}
.ksrange:focus-visible{outline:3px solid var(--hot);outline-offset:2px;border-radius:6px}
html.gaze .ksbtn{width:68px;min-height:56px}
/* key size at the right end of the top toolbar while the on-screen keyboard is on (phones keep the bar under the keys) */
.tbks,.tbksep{display:none}
.tbks{flex-direction:column;align-items:stretch;justify-content:center;gap:0;padding:0 2px}
.tbkscap{font:bold 10.5px/12px var(--font);color:var(--ink-soft);text-align:center;white-space:nowrap;letter-spacing:.2px}
.tbksrow{display:flex;align-items:center;gap:2px}
.tbks .ksbtn{width:36px;min-height:28px;font:bold 22px/1 var(--font);color:var(--ink);background:none;border:1px solid transparent;border-radius:3px;box-shadow:none}
.tbks .ksbtn:hover{background:var(--signal);color:#fff}
.tbks .ksrange{flex:0 0 84px;width:84px;min-width:84px;height:28px}
.tbks .ksrange::-webkit-slider-thumb{width:22px;height:22px;margin-top:-7px}

@media (min-width:641px){
  html.kbon .tbks{display:flex}

}

.switchbar{order:4;flex:0 0 auto;padding:6px var(--gx2) 6px var(--gx);background:var(--face);border-top:1px solid var(--face-dk)}
.switchbar .act{width:100%;padding:12px;font-size:17px;font-weight:bold}

/* eye gaze: a ring where you look fills up; the button you look at is outlined; the Pause bar stops choosing */
.gzonly,.edscroll,.dlgscroll{display:none}
html.gaze .gzonly{display:inline-block}

.dlgscroll{color:#fff;font-size:16px;align-items:center;justify-content:center}
.gzring{position:fixed;left:0;top:0;width:60px;height:60px;pointer-events:none;z-index:70}
.gzring svg{display:block}
.gzring circle{fill:none;stroke-width:6}
.gzring .gzbg{stroke:rgba(49,106,197,.28)}
.gzring .gzfg{stroke:var(--signal);stroke-linecap:round;transform:rotate(-90deg);transform-origin:30px 30px;stroke-dasharray:150.8;stroke-dashoffset:150.8}

.gz-on{outline:3px solid var(--signal) !important;outline-offset:2px}

#webgazerVideoContainer{z-index:66 !important}

/* scanning highlight */
.scan-group{outline:4px solid var(--hot);outline-offset:2px}

/* dwell progress */
.dwelling::after{content:"";position:absolute;left:0;bottom:0;height:7px;width:100%;background:var(--signal);transform-origin:left;animation:dwellfill var(--dwell) linear forwards;pointer-events:none}

/* status bar */

/* Retired desktop shell: keep legacy DOM references inert for compatibility. */
.taskbar,#startmenu{display:none !important}

/* taskbar */
.taskbar{position:relative;flex:0 0 auto;display:flex;align-items:stretch;gap:6px;height:38px;
  background:linear-gradient(180deg,#1F2F86 0%,#3165C4 3%,#3682E5 6%,#4490E6 10%,#3883E5 12%,#2B71E0 15%,#2663DA 18%,#235BD6 20%,#2258D5 23%,#2157D6 38%,#245DDB 54%,#2562DF 86%,#245FDC 89%,#2158D4 92%,#1D4EC0 95%,#1941A5 98%)}

  background:linear-gradient(180deg,#388E38 0%,#5DB45D 8%,#41A541 22%,#3C9D3C 50%,#358E35 80%,#2E7D2E 100%);
  box-shadow:inset -2px 0 4px rgba(0,0,0,.35),inset 0 1px 2px rgba(255,255,255,.45);color:#fff;font:italic bold 19px/1 var(--titlefont);text-shadow:1px 1px 2px rgba(0,0,0,.6)}

  background:linear-gradient(#F35325,#F35325) 0 0/9px 9px no-repeat,linear-gradient(#81BC06,#81BC06) 11px 0/9px 9px no-repeat,linear-gradient(#05A6F0,#05A6F0) 0 11px/9px 9px no-repeat,linear-gradient(#FFBA08,#FFBA08) 11px 11px/9px 9px no-repeat;

  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:linear-gradient(180deg,#1E52B7 0%,#2A66D6 100%);border:1px solid #1D3F99;box-shadow:inset 1px 1px 0 rgba(0,0,0,.25);pointer-events:none}
.tray{margin-left:auto;display:flex;align-items:center;padding:0 var(--gx2) 0 14px;font-size:12px;color:#fff;
  background:linear-gradient(180deg,#0C59B9 0%,#139EE9 5%,#18B5F2 10%,#139BEB 15%,#1290E8 50%,#0D8DEA 85%,#0E7AD6 100%);border-left:1px solid #092E51;box-shadow:inset 1px 0 1px #18BBFF}

/* dialogs */
.overlay{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:rgba(0,0,30,.45);

/* mouse words: tiles fly in and settle in a ring around the mouse. They are only drawn; Writy follows
   the mouse itself, so clicks still reach the page under them */
.mwlayer{position:fixed;inset:0;z-index:31;pointer-events:none;overflow:hidden}
.mwset{position:absolute;inset:0;--mws:1;transition:opacity .25s}

  padding:.18em .5em .22em;border-radius:.42em;font:700 calc(var(--sugsize) * var(--mws))/1.15 var(--edfont);
  background:var(--pz-bg);color:#fff;border:3px solid var(--pz-edge);overflow:hidden;

const U=Object.assign({u:{},b:{},t:{},p:{},c:{},k:{},cc:{}},S.get('sw.model',{}));

let modelDirty=false,modelTimer=null,uTot=null;
/* another Writy window saved what it learned: add it to ours (or, if it was told to forget more recently, start from its copy) */
function modelMergeIn(M){
  if(!M||typeof M!=='object'||!M.u)return;
  const mg=+M.g||0,ug=+U.g||0;
  if(mg<ug)return;
  if(mg>ug){
    ['u','b','t','p','c','k','cc'].forEach(m=>{U[m]=M[m]&&typeof M[m]==='object'?M[m]:{}});U.g=mg;
    for(let i=words.length-1;i>=0;i--){if(rank.get(words[i])===5000&&!(words[i] in U.u)){rank.delete(words[i]);words.splice(i,1)}}
  }else{
    if(M.c)Object.keys(M.c).forEach(k=>{if(!(k in U.c))U.c[k]=+M.c[k]||0});
    if(M.k)Object.keys(M.k).forEach(k=>{if(!(k in U.k)&&typeof M.k[k]==='string')U.k[k]=M.k[k]});
    if(M.cc)Object.keys(M.cc).forEach(k=>{if(!(k in U.cc))U.cc[k]=+M.cc[k]||0});
    ['u','b','t','p'].forEach(m=>{
      const src=M[m]||{};
      if(m==='u'||m==='p'){Object.keys(src).forEach(k=>{U[m][k]=Math.max(U[m][k]||0,+src[k]||0)})}
      else Object.keys(src).forEach(k=>{if(!src[k]||typeof src[k]!=='object')return;U[m][k]=U[m][k]||{};Object.keys(src[k]).forEach(w=>{U[m][k][w]=Math.max(U[m][k][w]||0,+src[k][w]||0)})});
    });
  }
  Object.keys(U.u).forEach(w=>{if(!rank.has(w)){rank.set(w,5000);words.push(w)}});uTot=null;
}
function saveModel(){
  modelTimer=null;if(!modelDirty)return;
  try{const raw=localStorage.getItem('sw.model');if(raw&&raw!==modelRaw)modelMergeIn(JSON.parse(raw))}catch(e){}
  if(Object.keys(U.u).length>6000){
    Object.keys(U.u).forEach(w=>{if(U.u[w]<=1)delete U.u[w]});uTot=null;
    ['b','t'].forEach(m=>Object.keys(U[m]).forEach(k=>{
      Object.keys(U[m][k]).forEach(w=>{if(U[m][k][w]<=1)delete U[m][k][w]});
      if(!Object.keys(U[m][k]).length)delete U[m][k];
    }));
  }
  modelWrite();modelDirty=false;
}
function modelWrite(){try{const out=JSON.stringify(U);localStorage.setItem('sw.model',out);modelRaw=out}catch(e){}}
function everyday(w){try{return SPELLSET.has(w)||rank.get(w)<5000}catch(e){return rank.get(w)<5000}}
function learnWord(w,c,weight,midSentence,prevUp){
  if(!cfg.learn)return;
  const orig=w;
  w=w.toLowerCase().replace(/’/g,"'");
  if(!/^[a-z]+(?:'[a-z]+)?$/.test(w))return;
  if(w.length<2&&w!=='a'&&w!=='i')return;
  if(midSentence&&w!=='i'&&!(orig.length>1&&orig===orig.toUpperCase())){
    const up=/^[A-Z]/.test(orig),cl=v=>Math.max(-5,Math.min(5,v));
    /* an everyday word inside a name or title (Mental Health Retreat) only counts for the word before it */
    if(!(up&&prevUp&&everyday(w))){U.c[w]=cl((U.c[w]||0)+(up?1:-1));if(!U.c[w])delete U.c[w]}
    const p=c&&c[c.length-1];
    if(p&&p!=='<s>'){const key=p+' '+w;if(up?prevUp:(key in U.cc||U.c[w]>0)){U.cc[key]=cl((U.cc[key]||0)+(up?1:-1));if(!U.cc[key])delete U.cc[key]}}
  }
  if(/[A-Z]/.test(orig.slice(1))&&/^[A-Za-z'’]+$/.test(orig)){if(!(rank.get(w)<5000))U.k[w]=orig.replace(/’/g,"'")}
  else if(U.k[w]&&midSentence&&/^[A-Za-z]/.test(orig))delete U.k[w];
  if(!rank.has(w)&&!U.u[w]){
    if(!U.p[w]){U.p[w]=1;modelDirty=true;schedModel();return}
    delete U.p[w];
  }
  U.u[w]=(U.u[w]||0)+weight;uTot=null;
  if(!rank.has(w)){rank.set(w,5000);words.push(w)}
  const p1=c[c.length-1];
  if(p1){
    bumpW(U.b,p1,w,weight);
    if(c.length>1) bumpW(U.t,c[c.length-2]+' '+p1,w,weight);
  }
  modelDirty=true;schedModel();
}
function bumpW(o,k,w,n){(o[k]||(o[k]={}))[w]=(o[k][w]||0)+n}
/* a sentence ended after these words ("</s>" is the end of a sentence; it is never offered as a word) */
function learnEnd(c){
  if(!cfg.learn||!c||!c.length)return;
  const w=c[c.length-1];if(!w||w==='<s>'||!/^[a-z0-9']+$/.test(w))return;
  bumpW(U.b,w,'</s>',1);
  if(c.length>1&&c[c.length-2])bumpW(U.t,c[c.length-2]+' '+w,'</s>',1);
  modelDirty=true;schedModel();
}
function schedModel(){if(!modelTimer)modelTimer=setTimeout(saveModel,1500)}

function osa(a,b,max){
  const al=a.length,bl=b.length;
  if(Math.abs(al-bl)>max)return max+1;
  let p2=null,p1=new Array(bl+1),c=new Array(bl+1);

   after a choice you must look away before the same spot can be chosen again. */

  wgOn:false,wgStarting:false,cal:false,raw:[],cands:null,candsScope:null,candsT:0,warned:false};

  const now=performance.now();
  if(gz.cands&&gz.candsScope===scope&&now-gz.candsT<300)return gz.cands;
  gz.cands=Array.from(scope.querySelectorAll('button')).filter(b=>!b.disabled&&!(rd.on&&b.closest('.treebox,.dialbox,.ddmenu,.phrbox,.floatsug')));gz.candsScope=scope;gz.candsT=now;

  if(!el)return null;

  if(el.closest('textarea,input,.dialbox'))return null;

  let best=null,bd=R;

  const p=gz.pt,fresh=!!p&&(cfg.gazeSrc!=='webcam'||now-p.t<700);

  if(gz.paused&&c&&c.id!=='gazePause')c=null;
  /* after a choice: stay locked while you keep looking at that spot (even if the button was redrawn);
     looking at something else for a moment unlocks it, so neighbours can be chosen right away */
  if(gz.lock){
    const r=gz.lockRect,on=fresh&&p.x>r.left-6&&p.x<r.right+6&&p.y>r.top-6&&p.y<r.bottom+6;
    if(!fresh||on||(c&&c===gz.lock)){c=null;gz.away=0}

  if(e.pointerType==='mouse')return;
  const b=e.target.closest&&e.target.closest('.sug[data-do=sug],.sug[data-do=tsug]');if(!b)return;
  clearTimeout(lp.t);lp.x=e.clientX;lp.y=e.clientY;lp.id=e.pointerId;lp.fired=false;
  lp.t=setTimeout(()=>{
    lp.t=null;if(!smenu.hidden)return;
    const w=sugWordOf(b);if(!w)return;
    lp.fired=true;pickClear();smOpen(w,lp.x+14,lp.y+14,false);
  },550);
},true);
/* lifting that finger must not type the word (or choose from the menu): its click is skipped */
document.addEventListener('pointerup',e=>{clearTimeout(lp.t);lp.t=null;if(lp.fired&&e.pointerId===lp.id){lp.eat=performance.now();lp.fired=false}},true);
document.addEventListener('pointercancel',()=>{clearTimeout(lp.t);lp.t=null;lp.fired=false},true);
document.addEventListener('pointermove',e=>{if(lp.t&&Math.hypot(e.clientX-lp.x,e.clientY-lp.y)>12){clearTimeout(lp.t);lp.t=null}},true);
document.addEventListener('click',e=>{if(lp.eat&&performance.now()-lp.eat<500){lp.eat=0;e.preventDefault();e.stopImmediatePropagation()}},true);
/* one-time tips take turns in the status bar */
let tipAt=0;
function tipLater(text,ms,wait){const now=Date.now(),at=Math.max(now+(wait==null?1500:wait),tipAt);tipAt=at+ms;setTimeout(()=>msg(text,ms),at-now)}
/* a one-time tip on a touch screen */
function tabletTip(){
  try{
    if(cfg.tablet||!matchMedia('(pointer: coarse)').matches||innerWidth<641||S.get('sw.tabtip',0))return;
    S.set('sw.tabtip',1);
    tipLater('On a tablet? Turn on Tablet mode under More for bigger buttons and Writy’s own keys.',10000);
  }catch(e){}
}

/* ---------- install Writy as an app (from the website): it opens from its own icon and works offline ---------- */
const inst={ev:null};
function pwaOK(){
  return !!document.querySelector('link[rel=manifest]')&&('serviceWorker' in navigator)&&window.top===window.self&&
    (location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1');
}
function standalone(){try{return matchMedia('(display-mode: standalone)').matches||navigator.standalone===true}catch(e){return false}}
function isIOS(){return /iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1)}
/* installed on an iPad, iPhone, or a Mac with Safari: that Writy keeps its own documents, apart from Safari's */
function appleApp(){
  try{const ua=navigator.userAgent;return standalone()&&(isIOS()||(/Safari\//.test(ua)&&/Macintosh/.test(ua)&&!/Chrome|Chromium|CriOS|Edg|Firefox|FxiOS|OPR/.test(ua)))}catch(e){return false}
}
function appHint(){
  try{
    if(!appleApp()||S.get('sw.apphint',0))return;
    S.set('sw.apphint',1);
    if(docs.length===1&&docs[0].text===WELCOME)tipLater('Documents from Safari are not in this installed Writy. Use Backup to bring them over.',15000);
  }catch(e){}
}
function instSync(){const el=$('smInstall');if(el)el.hidden=!(pwaOK()&&!standalone())}
function doInstall(){
  closeStart();
  if(inst.ev){
    const ev=inst.ev;inst.ev=null;
    try{ev.prompt();ev.userChoice.then(()=>instSync()).catch(()=>{})}catch(e){openDlg('install')}
    return;
  }
  openDlg('install');
}

  const ios=isIOS();

  const pc='<fieldset><legend>Computer (Chrome or Edge)</legend><ol class="inststeps"><li>Click the <b>install</b> button at the right end of the address bar (a screen with a down arrow), or open the browser menu and choose <b>Install Writy</b> (in Edge it is under Apps; in Chrome under Cast, save and share).</li><li>Click <b>Install</b>.</li></ol></fieldset>';
  const mac='<fieldset><legend>Mac (Safari)</legend><ol class="inststeps"><li>Choose <b>File</b>, then <b>Add to Dock</b>.</li><li>Click <b>Add</b>. Writy is now in your Dock.</li></ol></fieldset>';
  const droid='<fieldset><legend>Android</legend><ol class="inststeps"><li>In Chrome, open the menu (the three dots).</li><li>Choose <b>Install app</b> or <b>Add to Home screen</b>.</li></ol></fieldset>';
  return '<p class="dlgnote" style="margin-top:0;font-size:15px;color:var(--ink)">Installed, Writy opens from its own icon in its own window and works without internet.</p>'+
    '<p class="dlgnote" style="font-size:15px;color:var(--ink)"><b>Your documents:</b> installed from Chrome or Edge (on a computer or Android), Writy keeps the same documents. On an iPad, iPhone, or a Mac with Safari, the installed Writy keeps its own documents, apart from Safari. To bring yours along, open <b>Backup</b> here and choose <b>Copy backup text</b>. Then open the installed Writy, open <b>Backup</b>, paste it in the box and choose <b>Restore from pasted text</b>.</p>'+
    (ios?ipad+pc+mac:pc+mac+ipad)+droid+
    '<p class="dlgnote">Open Writy once while you are online after installing, so it can save itself on this device.</p>';
}
if(pwaOK()){

`<div class="help">
<p>Type in the white page. Words branch out from your cursor like a tree. The big words on the first row are your next word, most likely on the left. The smaller words under each one are what usually comes after it, so tapping one of those types both words at once. After you tap, a new tree grows from the word you picked.</p>
<p>The <b>Words</b> menu at the top picks how the suggested words appear: <b>Word tree</b>, <b>Radial dial</b>, <b>Drop-down menu</b> or <b>Mouse words</b>, or one of the older layouts. The one you are using has a dot next to it, and its name is on the button.</p>
<p><b>Radial dial</b> puts the same words on a round dial instead. Your last word is in the middle, the next words are the slices around it, and the follow-up words are the outer ring. You can tap anywhere in a slice, not just on the word. After you tap, the word moves to the middle and a new dial opens around it.</p>
<p><b>Drop-down menu</b> shows the words as a menu under your cursor instead, like the menus in Windows. Each word has a ▸ arrow: point at the word (or tap the arrow) to open a submenu of the words that usually come after it. Click a word to type it, or a word in the submenu to type both. The menu follows your cursor and drops down again after each word. With the keyboard, Up and Down move through the menu, Right opens the submenu, Left goes back and Enter types the word.</p>
<p><b>Whole phrases</b> offers endings for the sentence you are writing, like “your time.” after “Thank you for”. They come from sentences you have written before in Writy, your saved phrases, common sentences, and what Writy has learned about how you write, and they change as you type. Choose the last word you want: pointing at a word lights up everything that will be typed, so you can take just part of a phrase, and the end of the row takes all of it. Single words sit underneath for when no phrase fits. With the keyboard, Up or Down starts, Left and Right choose how much of the phrase, and Enter takes it.</p>
<p><b>Mouse words</b> lets you write with the mouse alone. Rest the mouse on the page and the next words fly in and circle around it. Move onto a word to type it, and the next words fly in around wherever the mouse is. Each word is in its own direction, so you can go straight to it without touching the others, and a word that lands under the mouse never types itself. The tools are along the bottom: a period and a comma, <b>Undo</b> (straight down) takes back the last word, and <b>Letters</b> shows the alphabet in a circle with the likely next letters in gold. Pick a letter and the words that start with it fly in. If the mouse slips off the words, or even out of the window, they wait where they are (dimmed) until you come back. Rest the mouse somewhere else on the page for a second and the same words fly over to it. Click in your text, scroll, or press Esc to send them away; they come back when the mouse rests again. The middle of the circle shows the end of what you have written. If words get typed when you only meant to pass over them, choose “Rest on it” in Settings.</p>
<p><b>Centered typing</b> keeps the line you are typing on in one place, in the middle of the page, and moves the text up as you write. If the words need more room, the line sits a little higher. If you scroll up to read, the page stays where you put it until you type or move the cursor. Turn it off under More or in Settings.</p>
<p>The older layouts are in the <b>Words</b> menu (and Settings) too: words around your cursor, one box under it, or a bar at the top. When you have not started a word, it offers the next word instead.</p>
<ul>
<li><kbd>Tab</kbd> takes the first suggestion.</li>
<li><kbd>Up</kbd> or <kbd>Down</kbd> starts picking a word. Then the arrow keys move between the words (in the tree, Left and Right move between branches and Up and Down move along a branch; on the dial, Left and Right go around it, Down moves out to the outer ring and Up moves back in), <kbd>Enter</kbd> takes the highlighted one and <kbd>Esc</kbd> cancels. Typing also cancels. <kbd>Ctrl</kbd> + <kbd>Up</kbd> or <kbd>Down</kbd> moves the cursor between lines. You can turn this off in Settings.</li>

/* ---------- teach from past writing ---------- */
function teachFrom(txt){
  const had=new Set(Object.keys(U.u)),seen={};let n=0;
  txt.replace(/([.!?])\s+/g,'$1\n').split(/\n+/).forEach(s=>{
    s=s.replace(/\S*\d\S*/g,' 0 ');
    let ctx=['<s>'],q=0,prev='';
    for(const mm of s.matchAll(/[A-Za-z][A-Za-z'’]*[A-Za-z]|[A-Za-z]|0/g)){
      if(mm[0]==='0'){ctx=[];prev='';q++;continue}
      const w=mm[0],l=w.toLowerCase().replace(/’/g,"'"),end=mm.index+w.length;
      if(!/^-[A-Za-z]/.test(s.slice(end,end+2))){
        learnWord(w,ctx.slice(-2),1,q>0,q>0&&/^[A-Z]/.test(prev)&&!/^I(?:['’]|$)/.test(prev));
        n++;seen[l]=(seen[l]||0)+1;
      }
      ctx.push(l);q++;prev=w;
    }
    if(/[.!?]["')\]]*\s*$/.test(s)&&ctx.length&&ctx[ctx.length-1]!=='<s>')learnEnd(ctx.slice(-2));
  });
  modelDirty=true;saveModel();
  const fresh=Object.keys(U.u).filter(w=>!had.has(w)&&!SPELLSET.has(w));
  fresh.sort((a,b)=>(seen[b]||0)-(seen[a]||0));
  refresh();runCheck();
  return{n,fresh};
}

/* ---------- Email: a new email with this text, in Gmail or your email program ---------- */
const MAILRX=/^[^\s@,;<>]+@[^\s@,;<>]+\.[^\s@,;<>]+$/;
function mailParts(){
  const s=ta.selectionStart,e=ta.selectionEnd,part=s!==e&&ta.value.slice(s,e).trim()!=='';
  const src=(part?ta.value.slice(s,e):ta.value).replace(/\r\n?/g,'\n');
  const lines=src.replace(/^\s*\n/,'').split('\n');
  let to='',su='';
  /* first lines like "To: name@example.com" and "Subject: Lunch on Friday" fill in those boxes */
  for(let k=0;k<2&&lines.length;k++){
    const m=/^\s*(to|subject)\s*:\s*(.*?)\s*$/i.exec(lines[0]);if(!m)break;
    if(m[1].toLowerCase()==='to'){
      const a=m[2].split(/\s*[,;]\s*|\s+/).map(x=>x.replace(/[.,;:]+$/,'')).filter(Boolean);
      if(to||!a.length||!a.every(x=>MAILRX.test(x)))break;
      to=a.join(',');
    }else{if(su)break;su=m[2]}
    lines.shift();
  }
  const d=curDoc(),name=((d&&d.title)||'').trim();
  if(!su&&name&&name!=='Untitled')su=name;
  return{to,su,body:lines.join('\n').replace(/^\s*\n/,'').replace(/\s+$/,''),part,blank:!src.trim()};
}
function mailURL(p,gm){
  const q=[];
  if(gm){
    if(p.to)q.push('to='+encodeURIComponent(p.to));
    if(p.su)q.push('su='+encodeURIComponent(p.su));
    if(p.body)q.push('body='+encodeURIComponent(p.body));
    return 'https://mail.google.com/mail/?view=cm&fs=1'+(q.length?'&'+q.join('&'):'');
  }
  if(p.su)q.push('subject='+encodeURIComponent(p.su));
  if(p.body)q.push('body='+encodeURIComponent(p.body.replace(/\n/g,'\r\n')));
  return 'mailto:'+(p.to?p.to.replace(/[%?&#]/g,encodeURIComponent):'')+(q.length?'?'+q.join('&'):'');
}
function openMail(url,gm){
  if(gm){const w=window.open(url,'_blank');if(!w)return false;try{w.opener=null}catch(e){}return true}
  /* your email program: a mailto link (a new tab when Writy runs inside another page) */
  const a=document.createElement('a');a.href=url;if(window.top!==window.self)a.target='_blank';
  document.body.appendChild(a);a.click();a.remove();return true;
}

async function emailIt(){
  if(saveTimer){clearTimeout(saveTimer);saveDocs()}
  const p=mailParts(),gm=cfg.mailer!=='app';
  if(p.blank){msg('Nothing to email yet.');return}
  /* a link can only carry so much text: a long page is copied instead, to paste into the email */
  let url=mailURL(p,gm),longMsg='';
  if(p.body&&url.length>(gm?6000:1800)){
    const ok=await copyQuiet(p.body);
    url=mailURL({to:p.to,su:p.su,body:''},gm);
    longMsg=ok?'Your text is long, so Writy copied it. In the new email, click in the message and press Ctrl+V.':'Your text is too long to send this way. Press Copy, then paste it into the new email.';
  }
  if(!openMail(url,gm)){msg('Your browser blocked the new tab. Allow pop-ups for Writy (the sign at the right end of the address bar), then press Email again.',15000);return}
  msg(longMsg||'New email opened in '+(gm?'Gmail':'your email program')+(p.part?' with the selected text':'')+'. '+(p.to?'Check it, then send.':'Add who it goes to, then send.'),longMsg?15000:8000);

    });
  }

  }

  $('smTw').textContent=cfg.typewriter?'Turn off centered typing':'Turn on centered typing';
  $('btnCheck').setAttribute('aria-pressed',cfg.check);
  $('btnDark').setAttribute('aria-pressed',isDark());
  setCols();applyPhr();twLayout();refresh();runCheck();
  gzApply();twQueue();
}

/* ---------- display modes ---------- */
let windowMaximized=false;
const deskEl=document.querySelector('.desk');
function syncWindowMode(){
  const full=!!document.fullscreenElement;
  const max=windowMaximized||full;
  deskEl.classList.toggle('maximized',max);
  const btn=$('btnMax');
  btn.setAttribute('aria-pressed',String(max));
  btn.setAttribute('aria-label',max?'Restore window':'Maximize window');
  btn.title=max?'Restore window':'Maximize window';
  $('smFullscreen').textContent=full?'Exit full screen':'Full screen';
  requestAnimationFrame(()=>window.dispatchEvent(new Event('resize')));
}
function toggleMaximize(){
  if(document.fullscreenElement){
    windowMaximized=false;
    document.exitFullscreen().catch(()=>msg('Could not exit full screen. Press Esc.'));
  }else windowMaximized=!windowMaximized;
  syncWindowMode();
}
function toggleFullscreen(){
  closeStart();
  if(document.fullscreenElement){
    document.exitFullscreen().catch(()=>msg('Could not exit full screen. Press Esc.'));
  }else if(document.documentElement.requestFullscreen){
    document.documentElement.requestFullscreen().catch(()=>msg('Full screen is blocked here. Try F11 in your browser, or use Maximize.'));
  }else msg('This browser does not support app full screen. Try F11, or use Maximize.');
}
document.addEventListener('fullscreenchange',syncWindowMode);
document.addEventListener('fullscreenerror',()=>msg('Full screen was blocked. Try F11, or use Maximize.'));
document.querySelector('.titlebar').addEventListener('dblclick',e=>{
  if(!e.target.closest('button'))toggleMaximize();
});

/* ---------- actions ---------- */
let armed=null;
function act(what,arg,el){
  switch(what){
    case'sug':{const w=curSug[+arg];if(w)accept(w);break}
    case'psug':{if(Date.now()-(phr.took||0)<350)break;phr.took=Date.now();const q=String(arg).split('.');takePhrase(+q[0],+q[1]);break}
    case'tsug':{if(Date.now()-(tree.took||0)<350)break;tree.took=Date.now();const p=String(arg).split('.');takeTree(+p[0],p.length>1?+p[1]:-1);break}
    case'darkmode':{
      const was=isDark();cfg.theme=was?'light':'dark';saveCfg();applyCfg();if(dlgKind==='settings')renderDlg();
      msg(was?'Light mode.':'Dark mode. Press Dark again for light.');
      if(fine)ta.focus({preventScroll:true});break;
    }
    case'typewriter':{
      cfg.typewriter=!cfg.typewriter;saveCfg();applyCfg();closeStart();if(dlgKind==='settings')renderDlg();
      msg(cfg.typewriter?'Centered typing on. The line you type on stays in the middle.':'Centered typing off.');
      if(fine)ta.focus({preventScroll:true});break;
    }
    case'tree':case'dial':case'menu':case'mouse':case'phrase':{
      const back=['around','cursor','top'].indexOf(cfg.lastPlace)>=0?cfg.lastPlace:'around';
      const was=cfg.place===what;
      cfg.place=was?back:what;if(what==='mouse')mw.mode='words';
      saveCfg();applyCfg();closeStart();if(dlgKind==='settings')renderDlg();
      if(what==='mouse'&&!was)msg('Mouse words on. Rest the mouse on the page and words come to it. Move onto a word to type it.',8000);
      else msg(({tree:'Word tree',dial:'Radial dial',menu:'Drop-down menu',mouse:'Mouse words',phrase:'Whole phrases'})[what]+(was?' off.':' on.'));break;
    }
    case'wordsmenu':if(wmOpen)wmClose();else wmOpenMenu(wmViaKey);wmViaKey=false;break;
    case'moremenu':if(mmOpenFlag)mmClose();else mmOpenMenu(mmViaKey);mmViaKey=false;break;
    case'tablet':setTablet(!cfg.tablet);break;
    case'install':doInstall();break;
    case'maximize':toggleMaximize();break;
    case'fullscreen':toggleFullscreen();break;
    case'setplace':wmClose();setPlace(arg);break;
    case'wlen':setWlen(wlenV()+(+arg));break;
    case'hideword':{const w=hideWord(smWord,true);smClose();if(w)msg('Writy will not suggest “'+w+'” again. To bring it back, open Settings, Hidden words.',8000);if(fine)ta.focus({preventScroll:true});break}
    case'smclose':smClose();if(fine)ta.focus({preventScroll:true});break;
    case'unhide':{const w=hideWord(arg,false);renderDlg();if(w)msg('Writy will suggest “'+w+'” again.');break}
    case'hideadd':{
      const x=$('hideIn'),w=hnorm(x&&x.value);
      if(!w){msg('Type the word to hide first.');if(x)x.focus();break}
      hideWord(w,true);renderDlg();msg('Writy will not suggest “'+w+'” again.');
      setTimeout(()=>{const y=$('hideIn');if(y&&fine)y.focus()},30);break;
    }
    case'ksinfo':msg(ksText(),12000);break;
    case'readability':openDlg('readability');break;
    case'rdgo':{const q=String(arg).split('-');closeDlg();showRange(+q[0],+q[1]);break}
    case'wordsettings':{
      wmClose();openDlg('settings');
      const lg=[...$('dlgBody').querySelectorAll('legend')].find(x=>x.textContent==='Suggestions');
      if(lg){const d=$('dlgBody');d.scrollTop+=lg.parentNode.getBoundingClientRect().top-d.getBoundingClientRect().top-6}
      break;
    }
    case'ddopen':{const i=+arg;if(menu.side==='over'&&menu.active===i)menuActivate(-1);else menuActivate(i);break}
    case'key':keyPress(arg);break;
    case'kbsize':setKeyh(cfg.keyh+(+arg)*4);if(fine&&cfg.keys)ta.focus({preventScroll:true});break;
    case'fmttoggle':fmtSetOpen($('formatbar').hidden);break;
    case'richmode':richToggle(!richOn);break;
    case'fmtbold':fmtWrap('**');break;
    case'fmtitalic':fmtWrap('*');break;
    case'fmtunderline':fmtWrap('++');break;
    case'fmth1':fmtLines('h1');break;
    case'fmth2':fmtLines('h2');break;
    case'fmtbullet':fmtLines('bullet');break;
    case'fmtnumber':fmtLines('number');break;
    case'fmtquote':fmtLines('quote');break;
    case'fmtleft':richOn?richFormat('left'):msg('Turn on Rich text to align paragraphs.');break;
    case'fmtcenter':richOn?richFormat('center'):msg('Turn on Rich text to align paragraphs.');break;
    case'fmtright':richOn?richFormat('right'):msg('Turn on Rich text to align paragraphs.');break;
    case'fmtpreview':fmtTogglePreview();break;
    case'undo':histGo(-1);break;
    case'redo':histGo(1);break;
    case'new':closeStart();closeDlg();newDoc();break;
    case'docs':openDlg('docs');break;
    case'phrases':{
      if(mqWide.matches&&el&&el.classList.contains('tbtn')){
        cfg.phrPanel=!cfg.phrPanel;saveCfg();applyPhr();
        msg(cfg.phrPanel?'Side panel shown.':'Side panel hidden. Press Phrases to show your phrases and documents again.');
      }else openDlg('phrases');
      break;
    }
    case'phrasedit':openDlg('phrases');break;
    case'backup':openDlg('backup');break;
    case'versions':showVersions();break;
    case'revrestore':restoreVersion(+arg,el);break;
    case'persist':protectOfflineStorage();break;
    case'expdoc':exportDoc('doc');break;
    case'exptxt':exportDoc('txt');break;
    case'bkfile':doBackup('file');break;
    case'bkcopy':doBackup('copy');break;
    case'bkpick':$('bkFile').click();break;
    case'bkpaste':{const v=$('bkPaste').value;if(!v.trim()){msg('Paste the backup text into the box first.');$('bkPaste').focus();break}restoreFrom(v);break}
    case'settings':openDlg('settings');break;
    case'help':openDlg('help');break;
    case'closedlg':closeDlg();break;
    case'start':closeStart();break; // The retired desktop Start menu cannot reopen.
    case'speak':doSpeak();break;
    case'voicenext':{const L=voiceOrder(),i=L.indexOf(cfg.voice||'');setVoice(L[(i+1)%L.length]);break}
    case'voicetry':speakNow(SAMPLE);break;
    case'email':closeStart();if(dlgKind)closeDlg();emailIt();break;
    case'copy':{
      if(richOn){const sel=richSelection();const value=sel&&!sel.isCollapsed?sel.toString():richPlain();
        if(!value){msg('Nothing to copy yet.');break}
        try{navigator.clipboard.writeText(value).then(()=>msg('Copied text.'),()=>msg('Use Ctrl+C to copy.'))}catch(e){msg('Use Ctrl+C to copy.')}
        break;
      }
      const s=ta.selectionStart,e=ta.selectionEnd;
      const text=s!==e?ta.value.slice(s,e):ta.value;
      if(!text){msg('Nothing to copy yet.');break}
      const fallback=()=>{if(s===e)ta.select();msg('Press Ctrl+C (or Copy in your menu) to finish copying.')};
      try{navigator.clipboard.writeText(text).then(()=>msg(s!==e?'Copied the selected text.':'Copied the whole document.'),fallback)}catch(err){fallback()}
      break;
    }
    case'check':cfg.check=!cfg.check;saveCfg();applyCfg();break;
    case'chkfix':chkFix(+arg);break;
    case'chkshow':chkShow();break;
    case'chkignore':chkIgnore();break;
    case'chknext':chkNext();break;
    case'chkadd':chkAdd();break;
    case'keys':cfg.keys=!cfg.keys;if(!cfg.keys&&cfg.scan){cfg.scan=false;scanStart()}saveCfg();applyCfg();break;
    case'scan':
      cfg.scan=!cfg.scan;
      if(cfg.scan){cfg.keys=true;if(cfg.gaze){cfg.gaze=false;saveCfg()}}
      applyCfg();scanStart();msg(cfg.scan?'Scanning on. Press Space to choose.':'Scanning off.');break;
    case'switch':scanSelect();break;
    case'gaze':{
      cfg.gaze=!cfg.gaze;
      if(cfg.gaze){cfg.keys=true;if(cfg.scan){cfg.scan=false;scanStart()}gzSetPaused(false)}
      saveCfg();applyCfg();closeStart();if(dlgKind==='settings')renderDlg();
      msg(cfg.gaze?(cfg.gazeSrc==='webcam'?'Eye gaze on with the webcam.':(cfg.gazeDwellOn?'Eye gaze on. Look at a button and hold your gaze to choose it.':'Eye gaze on.')):'Eye gaze off.',6000);break;
    }
    case'edup':case'eddown':twAway=true;ta.scrollTop+=(what==='edup'?-1:1)*Math.max(40,ta.clientHeight*.8);break;
    case'dlgup':case'dlgdown':{const d=$('dlgBody');d.scrollTop+=(what==='dlgup'?-1:1)*Math.max(60,d.clientHeight*.75);break}
    case'gazepause':gzSetPaused(!gz.paused);msg(gz.paused?'Eye control paused. Look at Resume gaze (top right) to start again.':'Eye control on.',5000);break;
    case'gazecal':closeDlg();if(gz.wgOn)gzCalibrate();else if(cfg.gaze&&cfg.gazeSrc==='webcam')wgStart();break;
    case'gazecalstop':gzCalStop();msg('Calibration stopped.');break;
    case'smaller':{const sizes=[40/3,16,24,30,32,38,48];const i=sizes.findIndex(x=>Math.abs(x-cfg.size)<.05);cfg.size=sizes[i>=0?Math.max(0,i-1):Math.max(0,sizes.findIndex(x=>x>=cfg.size)-1)];saveCfg();applyCfg();closeStart();break}
    case'bigger':{const sizes=[40/3,16,24,30,32,38,48];const i=sizes.findIndex(x=>Math.abs(x-cfg.size)<.05);cfg.size=sizes[i>=0?Math.min(sizes.length-1,i+1):Math.max(0,sizes.findIndex(x=>x>cfg.size))];saveCfg();applyCfg();closeStart();break}
    case'opendoc':if(arg!==curId)loadDoc(arg);closeDlg();break;
    case'deldoc':{
      if(armed!==arg){armed=arg;if(el){el.textContent='Sure?';el.classList.add('armed')}setTimeout(()=>{if(armed===arg){armed=null;renderNav();if(dlgKind==='docs')renderDlg()}},3000);break}
      armed=null;
      const idx=docs.findIndex(d=>d.id===arg);if(idx<0)break;
      goneAdd(arg,Math.max(Date.now(),(docs[idx].updated||0)+1));
      docs.splice(idx,1);
      if(!docs.length)docs.push({id:uid(),title:'Untitled',text:'',updated:Date.now()});
      saveDocs();
      if(arg===curId)loadDoc(docs.slice().sort((a,b)=>b.updated-a.updated)[0].id);else renderNav();
      if(dlgKind==='docs')renderDlg();
      break;
    }
    case'insphrase':{const p=phrases[+arg];if(p){closeDlg();insertPhrase(p)}break}
    case'addphrase':{
      const inp=$('phraseIn');const t=inp.value.trim();
      if(t){phrases.push(t);savePhr();renderNav();renderDlg();$('phraseIn').focus()}
      break;
    }
    case'delphrase':phrases.splice(+arg,1);savePhr();renderNav();renderDlg();break;
    case'addabbr':{
      const k=($('abbrK').value||'').trim().toLowerCase(),v=($('abbrV').value||'').trim();
      if(!/^[a-z][a-z0-9]{1,11}$/.test(k)){msg('A shortcut is 2 to 12 letters, like tyft.',5000);$('abbrK').focus();break}
      if(!v){msg('Type the full text the shortcut turns into.');$('abbrV').focus();break}
      if(SPELLSET.has(k)||rank.get(k)<5000){msg('“'+k+'” is a real word, so it would change every time you type it. Pick something like tyft.',7000);$('abbrK').focus();break}
      const i=abbrs.findIndex(a=>a.k===k);if(i>=0)abbrs[i].v=v;else abbrs.push({k,v});
      saveAbbr();renderDlg();msg('Shortcut “'+k+'” saved.');setTimeout(()=>{const x=$('abbrK');if(x&&fine)x.focus()},30);break;
    }
    case'delabbr':abbrs.splice(+arg,1);saveAbbr();renderDlg();break;
    case'set':{
      const name=el.dataset.name;let val=el.dataset.val;
      if(val==='true')val=true;else if(val==='false')val=false;else if(!isNaN(+val)&&val!=='')val=+val;
      cfg[name]=val;if(name==='place'&&['around','cursor','top'].indexOf(val)>=0)cfg.lastPlace=val;
      if(name==='tablet'&&val)cfg.keys=true;
      if(name==='gaze'&&val){cfg.keys=true;if(cfg.scan){cfg.scan=false;scanStart()}}saveCfg();applyCfg();renderDlg();break;
    }
    case'teach':openDlg('teach');setTimeout(()=>{const x=$('teachIn');if(x&&fine)x.focus()},50);break;
    case'teachgo':{
      const x=$('teachIn'),txt=x?x.value:'';
      if(!txt.trim()){msg('Paste some of your writing in the box first.');break}
      if(!cfg.learn){$('teachOut').textContent='Learning is turned off. Turn on “Learn from my writing” in Settings first.';break}
      const r=teachFrom(txt);x.value='';
      const show=r.fresh.slice(0,6).map(w=>fmt(w,'',false));
      $('teachOut').textContent='Learned from '+r.n.toLocaleString()+' words.'+(r.fresh.length?' '+r.fresh.length+' new word'+(r.fresh.length===1?'':'s')+' it will now suggest and accept, like '+show.join(', ')+'.':' No new words, but it now knows how you put words together.');
      msg('Writy learned from your writing.');break;
    }
    case'forget':{
      if(!el.dataset.armed){el.dataset.armed='1';el.textContent='Press again to forget';setTimeout(()=>{if(dlgKind==='settings')renderDlg()},3000);break}
      U.u={};U.b={};U.t={};U.p={};U.c={};U.k={};U.cc={};U.g=Date.now();uTot=null;modelDirty=true;saveModel();S.set('sw.modelg',U.g);
      for(let i=words.length-1;i>=0;i--){if(rank.get(words[i])===5000){rank.delete(words[i]);words.splice(i,1)}}
      renderDlg();refresh();msg('Learned words cleared.');break;
    }
  }
}
document.addEventListener('change',e=>{
  if(e.target.id==='bkFile'&&e.target.files[0]){
    const r=new FileReader();r.onload=()=>restoreFrom(r.result);r.onerror=()=>msg('Could not read that file.');r.readAsText(e.target.files[0]);
  }
});
try{const rm=sessionStorage.getItem('sw.restored');if(rm){sessionStorage.removeItem('sw.restored');setTimeout(()=>msg('Restored: '+rm+'.'),400)}}catch(e){}
document.addEventListener('click',e=>{
  if(wmOpen&&!e.target.closest('#wordsmenu,#btnWords'))wmClose();
  if(!smenu.hidden&&!e.target.closest('#sugmenu'))smClose();
  if(mmOpenFlag&&!e.target.closest('#moremenu,#btnMore'))mmClose();
  const b=e.target.closest('[data-do]');
  /* a choice in More closes it (the size buttons keep it open while you adjust) */
  if(b&&mmOpenFlag&&b.closest('#moremenu')&&!b.closest('.wmlen'))mmClose();
  if(b&&!b.disabled)act(b.dataset.do,b.dataset.arg,b);
  else if(startOpen&&!e.target.closest('.startmenu'))closeStart();
  if(b&&b.dataset.do!=='start'&&startOpen&&!b.closest('.startmenu'))closeStart();
});
document.addEventListener('mousedown',e=>{
  if(e.target.closest('.sug,.key,.tbtn,.fmtbtn,.navbtn,.switchbar button,.edscroll button,.chkbtn,.treebox,.dialbox,.ddmenu,.floatsug,.wmitem,.phrbox'))e.preventDefault();
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    if(!smenu.hidden){smClose();if(fine)ta.focus({preventScroll:true})}
    else if(gz.cal){gzCalStop();msg('Calibration stopped.')}
    else if(!$('overlay').hidden)closeDlg();
    else if(wmOpen)wmClose(true);
    else if(mmOpenFlag)mmClose(true);
    else if(startOpen)closeStart();
    else if(cfg.scan&&scan.mode==='item'){scan.mode='group';scanMark()}
    else if(mw.on){mwHide(150);if(mw.pt)mw.paused={x:mw.pt.x,y:mw.pt.y}}
    else stopSpeech();
  }
  if(e.key==='Enter'&&e.target.id==='phraseIn'){e.preventDefault();act('addphrase')}
  if(e.key==='Enter'&&e.target.id==='hideIn'){e.preventDefault();act('hideadd')}
  if(e.key==='Enter'&&(e.target.id==='abbrK'||e.target.id==='abbrV')){e.preventDefault();if(e.target.id==='abbrK'&&!$('abbrV').value.trim())$('abbrV').focus();else act('addabbr')}
});
$('docTitle').addEventListener('input',e=>{
  const d=curDoc();d.title=e.target.value;d.updated=Date.now();
  $('taskTitle').textContent='Writy - '+(d.title||'Untitled');
  if(saveTimer)clearTimeout(saveTimer);saveTimer=setTimeout(saveDocs,500);
});
$('docTitle').addEventListener('change',e=>{
  const d=curDoc();d.title=e.target.value.trim()||'Untitled';e.target.value=d.title;renderNav();saveDocs();
});
window.addEventListener('pagehide',()=>{if(saveTimer){clearTimeout(saveTimer);saveDocs()}saveModel()});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&saveTimer){clearTimeout(saveTimer);saveDocs()}});
/* another Writy window saved something: show it here too, so this window never saves an older copy over it */
window.addEventListener('storage',e=>{
  try{
    if(e.key==='sw.docs'&&e.newValue&&e.newValue!==docsRaw){
      docsTakeIn(JSON.parse(e.newValue));
      const d=curDoc(),g=goneGet();
      if(d&&g[d.id]&&g[d.id]>=(d.updated||0)){
        /* the open document was deleted in another window */
        if(saveTimer){clearTimeout(saveTimer);saveTimer=null}
        docs=docs.filter(x=>x.id!==d.id);
        if(!docs.length){docs.push({id:uid(),title:'Untitled',text:'',updated:Date.now()});docsWrite()}
        loadDoc(docs.slice().sort((a,b)=>b.updated-a.updated)[0].id);
        msg('That document was deleted in another Writy window.',8000);
      }
    }else if(e.key==='sw.cfg'&&e.newValue){
      const nc=JSON.parse(e.newValue);if(!nc||typeof nc!=='object')return;
      const scanWas=cfg.scan;
      Object.keys(DEF).forEach(k=>{if(k in nc)cfg[k]=nc[k]});
      cfg.scan=scanWas;applyCfg();if(dlgKind==='settings')renderDlg();
    }else if(e.key==='sw.phr'&&e.newValue){
      const v=JSON.parse(e.newValue);if(Array.isArray(v)){phrases=v;renderNav();if(dlgKind==='phrases')renderDlg()}
    }else if(e.key==='sw.abbr'&&e.newValue){
      const v=JSON.parse(e.newValue);if(Array.isArray(v)){abbrs=v;if(dlgKind==='phrases')renderDlg()}
    }else if(e.key==='sw.modelg'&&e.newValue){
      /* "Forget what it learned" was pressed in another window */
      const g=+JSON.parse(e.newValue)||0;
      if(g>(+U.g||0)){
        U.u={};U.b={};U.t={};U.p={};U.c={};U.k={};U.cc={};U.g=g;uTot=null;
        if(modelTimer){clearTimeout(modelTimer);modelTimer=null}modelDirty=false;
        for(let i=words.length-1;i>=0;i--){if(rank.get(words[i])===5000){rank.delete(words[i]);words.splice(i,1)}}
        refresh();
      }
    }else if(e.key==='sw.ks'&&e.newValue){
      ksBase=Object.assign({},ksMerge(JSON.parse(e.newValue)));ksShow();
    }else if(e.key==='sw.dict'&&e.newValue){
      const v=JSON.parse(e.newValue);if(Array.isArray(v)){userDict=new Set(v);runCheck()}
    }
  }catch(err){}
});

/* ---------- start ---------- */
(async function boot(){
  ta.disabled=true;$('docTitle').disabled=true;
  try{await hydrateDocs()}catch(e){storeReady=true;storeAvailable=false}
  const d=curDoc();
  ta.value=d.text;
  ta.setSelectionRange(d.text.length,d.text.length);
  histReset();renderNav();applyCfg();setSpeakLabel();appHint();tabletTip();instSync();
  fmtSetOpen(window.innerHeight>=900);
  ta.disabled=false;
  if(cfg.richMode)richToggle(true);$('docTitle').disabled=false;
  ta.scrollTop=ta.scrollHeight;twCenter();placeFloat();syncWindowMode();
  docsWrite(); /* seed IndexedDB on migration, or refresh the browser fallback */
  if(!storeAvailable)msg('Saving uses browser storage only. Use Backup → Save backup file regularly.',10000);
  if(fine)(richOn?richEl:ta).focus({preventScroll:true});
})();
})();
