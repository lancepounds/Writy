name: Writy storage tests
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  storage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependency
        run: npm install --no-audit --no-fund
      - name: Run offline-first regression tests
        run: npm test
      - name: Install Chromium and Safari WebKit for browser checks
        run: npx playwright install --with-deps chromium webkit
      - name: Run cross-browser persistence checks
        run: npm run test:browser
